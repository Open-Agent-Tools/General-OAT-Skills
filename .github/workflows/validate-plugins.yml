# Validate every plugin in the marketplace.
#
# `claude plugin validate .` on its own only checks marketplace.json -- it does
# not descend into the directories its `source` fields point at. This walks each
# one. It also refuses symlinks: git checks those out as plain text files on
# Windows, which silently turns a skill directory into a 21-byte file and ships
# a plugin with zero skills.
name: Validate Plugins

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install -g @anthropic-ai/claude-code

      - name: No symlinks (they break on Windows checkouts)
        run: |
          if git ls-files -s | awk '$1 == "120000" { print $4 }' | grep .; then
            echo "::error::the paths above are symlinks -- commit real files instead"
            exit 1
          fi

      - name: Validate marketplace and every plugin
        run: |
          set -euo pipefail
          claude plugin validate . --strict
          jq -r '.plugins[].source' .claude-plugin/marketplace.json | while read -r dir; do
            echo "--- $dir"
            claude plugin validate "$dir" --strict
          done

      - name: README documents every plugin
        run: |
          python3 - <<'PY'
          import json, re, pathlib, sys
          mp = json.load(open(".claude-plugin/marketplace.json"))
          names = {p["name"] for p in mp["plugins"]}
          mkt = mp["name"]
          cmds = re.findall(r'^/plugin install (\S+)', pathlib.Path("README.md").read_text(), re.M)
          fail = False
          for c in cmds:
              plug, _, m = c.partition("@")
              if plug not in names:
                  print(f"::error::README: no plugin named '{plug}' ({c})"); fail = True
              elif m != mkt:
                  print(f"::error::README: '{c}' is reversed -- the form is <plugin>@{mkt}"); fail = True
          for n in sorted(names - {c.partition("@")[0] for c in cmds}):
              print(f"::error::README: no install command documented for '{n}'"); fail = True
          print(f"{len(cmds)} install commands, {len(names)} plugins")
          sys.exit(fail)
          PY
